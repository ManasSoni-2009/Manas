<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="100%">
    <defs>
        <style>
            .line {
                stroke-dasharray: 800;
                stroke-dashoffset: 800;
                animation: draw 2s ease-out forwards;
            }
            .dot {
                fill: #D2FF00;
                animation: glow 1.5s infinite alternate;
            }

            @keyframes draw {
                to { stroke-dashoffset: 0; }
            }

            @keyframes glow {
                from { filter: drop-shadow(0 0 2px #D2FF00); }
                to { filter: drop-shadow(0 0 8px #D2FF00); }
            }
        </style>

        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0a0a0b" />
            <stop offset="50%" stop-color="#D2FF00" />
            <stop offset="100%" stop-color="#0a0a0b" />
        </linearGradient>
    </defs>

    <line x1="0" y1="10" x2="800" y2="10" stroke="url(#grad)" stroke-width="2" class="line" />

    <!-- Center decoration -->
    <rect x="390" y="5" width="20" height="10" fill="#0a0a0b" />
    <circle cx="395" cy="10" r="3" class="dot" />
    <circle cx="405" cy="10" r="3" class="dot" />
</svg>